<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>REA Scene Manager</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app">
  <nav class="sidebar">
    <div class="side-head">
      <span class="logo">R</span>
      <span class="side-title">Scene Manager</span>
    </div>
    <button class="nav-item" data-view="setups"><span data-icon="list"></span><span class="label">Setups</span><span class="nav-count" id="navCount"></span></button>
    <button class="nav-item" data-view="cameras"><span data-icon="camera"></span><span class="label">Cámaras</span></button>
    <button class="nav-item" data-view="render"><span data-icon="render"></span><span class="label">Render</span><span class="nav-count" id="navRender"></span></button>
    <div class="spacer"></div>
    <button class="nav-item" data-view="settings"><span data-icon="settings"></span><span class="label">Ajustes</span></button>
    <div class="side-foot" id="sideFoot"></div>
  </nav>
  <main id="main"></main>
</div>
<div id="overlay"></div>
<div id="toasts"></div>
<script src="icons.js"></script>
<script src="bridge.js"></script>
<script src="app.js"></script>
</body>
</html>
