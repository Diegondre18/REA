<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>REA Scene Manager</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">
      <span class="logo">R</span>
      <div class="brand-text">
        <strong>Scene Manager</strong>
        <span id="fileName">Sin archivo</span>
      </div>
    </div>
    <label class="search">
      <span data-icon="search"></span>
      <input id="search" type="text" placeholder="Buscar setups" autocomplete="off" spellcheck="false">
      <button class="kbd" data-action="palette" title="Paleta de comandos">Ctrl K</button>
    </label>
    <div class="spacer"></div>
    <div id="topActions" class="top-actions"></div>
  </header>

  <nav class="rail">
    <button class="rail-btn" data-view="setups" title="Setups" data-icon="grid"></button>
    <button class="rail-btn" data-view="cameras" title="Camaras" data-icon="camera"></button>
    <button class="rail-btn" data-view="render" title="Render" data-icon="render"></button>
    <div class="spacer"></div>
    <button class="rail-btn" data-view="settings" title="Ajustes" data-icon="settings"></button>
  </nav>

  <main id="main"></main>

  <footer id="statusbar" class="statusbar"></footer>
</div>
<div id="overlay"></div>
<div id="toasts"></div>
<script src="icons.js"></script>
<script src="bridge.js"></script>
<script src="app.js"></script>
</body>
</html>
