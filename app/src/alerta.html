<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #17213b; font-family: "Inter", "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; color: #fff; user-select: none; }
  #shot { position: fixed; inset: -40px; background-size: cover; background-position: center; filter: blur(22px) saturate(0.9); transform: scale(1.04); }
  /* Colores del manual: azul brillante 0057FF y azul oscuro 17213B. */
  #tint { position: fixed; inset: 0; background: linear-gradient(135deg, rgba(23,33,59,0.82) 0%, rgba(0,87,255,0.62) 100%); }
  #tint::after { content: ""; position: absolute; inset: 0; background-image: radial-gradient(rgba(255,255,255,0.06) 1px, transparent 1px); background-size: 22px 22px; }
  .wrap { position: fixed; inset: 0; display: grid; place-items: center; padding: 32px; }
  .card { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 36px; align-items: center; width: min(820px, 100%); padding: 40px 46px; border-radius: 26px;
    background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.28); box-shadow: 0 40px 120px -30px rgba(0,0,0,0.55); backdrop-filter: blur(6px); animation: pop 0.45s cubic-bezier(.2,1.4,.4,1); }
  @keyframes pop { from { opacity: 0; transform: scale(0.9) translateY(10px); } }
  .card.shake { animation: shake 0.5s ease; }
  @keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }
  canvas { image-rendering: pixelated; width: 150px; }
  .brand { display: flex; align-items: center; gap: 10px; font-size: 13px; letter-spacing: 0.32em; color: rgba(255,255,255,0.85); margin-bottom: 18px; }
  .brand svg { width: 34px; height: 30px; color: #fff; }
  .brand span { letter-spacing: 0; opacity: 0.75; }
  .eyebrow { font-size: 13px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: #9fb9ff; }
  .eyebrow::before { content: "// "; color: #fff; }
  h1 { margin: 8px 0 10px; font-size: 46px; font-weight: 300; letter-spacing: -0.02em; line-height: 1.05; }
  p { margin: 0; font-size: 18px; line-height: 1.45; color: rgba(255,255,255,0.9); }
  .team { margin-top: 12px; font-size: 15px; color: #c9d6ff; }
  .acts { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 26px; }
  button { font: inherit; font-size: 16px; font-weight: 600; border-radius: 12px; padding: 13px 24px; cursor: pointer; border: 1px solid rgba(255,255,255,0.45); background: transparent; color: #fff; }
  button:hover { background: rgba(255,255,255,0.12); }
  button.main { background: #fff; color: #0057ff; border-color: #fff; }
  button.main:hover { background: #e9efff; }
  button:focus-visible { outline: 3px solid #9fb9ff; outline-offset: 2px; }
  .hint { margin-top: 16px; font-size: 13px; color: rgba(255,255,255,0.7); }
</style>
