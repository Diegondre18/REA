name: App de Windows y servidor

on:
  push:
    branches: ["main", "claude/**"]
    tags: ["v*"]
    paths: ["app/**", "servidor/**", ".github/workflows/windows.yml"]
  workflow_dispatch:
    inputs:
      publicar:
        description: "Publicar esta versión en Releases (los PC con 2.1 o posterior se actualizan solos)"
        type: boolean
        default: false

permissions:
  contents: write

env:
  PB_VERSION: "0.40.5"

jobs:
  app:
    name: Instalador de Windows
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json
      # Sin scripts de instalación: electron-builder descarga Electron por su cuenta.
      - run: npm ci --ignore-scripts
      - run: npm run vendor
      # El servidor viaja dentro de la app: reglas del estudio y PocketBase para Windows.
      - run: npm run bundle-server
      - name: Descargar PocketBase para Windows
        shell: pwsh
        run: |
          Invoke-WebRequest "https://github.com/pocketbase/pocketbase/releases/download/v$env:PB_VERSION/pocketbase_$($env:PB_VERSION)_windows_amd64.zip" -OutFile pb.zip
          Expand-Archive pb.zip -DestinationPath pbtmp
          Copy-Item pbtmp/pocketbase.exe server-bundle/pocketbase.exe
      - run: npx electron-builder --win nsis --x64 --publish never
      - name: Comprobar que el servidor va dentro de la app
        shell: pwsh
        run: |
          $dir = "dist/win-unpacked/resources/servidor"
          foreach ($f in @("pocketbase.exe", "pb_hooks/lib.js", "pb_hooks/maestro.pb.js", "pb_migrations/1763100000_copias.js")) {
            if (-not (Test-Path "$dir/$f")) { Write-Error "Falta $f dentro de la app"; exit 1 }
          }
          & "$dir/pocketbase.exe" --version
      - name: Comprobar que la app lleva todos sus archivos
        shell: pwsh
        run: |
          $list = npx --yes @electron/asar@3.2.17 list dist/win-unpacked/resources/app.asar
          # Cada archivo que main.js carga con require("./…") tiene que ir dentro del paquete.
          $locales = Select-String -Path main.js -Pattern 'require\("\./([\w-]+)"\)' -AllMatches | ForEach-Object { $_.Matches } | ForEach-Object { $_.Groups[1].Value }
          foreach ($f in @("main.js", "preload.js", "src/index.html", "node_modules/electron-updater/out/main.js") + ($locales | ForEach-Object { "$_.js" })) {
            if (-not ($list -contains "\$($f -replace '/', '\')")) { Write-Error "Falta $f dentro de la app"; exit 1 }
          }
          Write-Output "Archivos de la app completos"
      - uses: actions/upload-artifact@v4
        with:
          name: LAP-Cerebro-Setup
          # latest.yml y el .blockmap son los que lee la actualización automática de cada PC.
          path: |
            app/dist/*.exe
            app/dist/*.blockmap
            app/dist/latest.yml
          if-no-files-found: error

  servidor:
    name: Servidor para Windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Armar el paquete del servidor
        run: |
          mkdir -p out/LAP-Cerebro-Servidor
          curl -fsSL -o pb.zip "https://github.com/pocketbase/pocketbase/releases/download/v${PB_VERSION}/pocketbase_${PB_VERSION}_windows_amd64.zip"
          unzip -q pb.zip pocketbase.exe -d out/LAP-Cerebro-Servidor
          cp -r servidor/pb_migrations servidor/pb_hooks servidor/*.bat servidor/LEEME.md out/LAP-Cerebro-Servidor/
          (cd out && zip -qr LAP-Cerebro-Servidor-Windows.zip LAP-Cerebro-Servidor)
          # Reglas del servidor para el NAS: el contenedor las descarga solo en cada versión nueva.
          mkdir -p out/reglas/nas
          cp -r servidor/pb_migrations servidor/pb_hooks out/reglas/
          echo "$PB_VERSION" > out/reglas/PB_VERSION
          cp servidor/nas/cerebro.js app/host.js out/reglas/nas/
          (cd out/reglas && zip -qr ../LAP-Cerebro-Reglas.zip .)
          # Paquete para instalar en el NAS por primera vez.
          mkdir -p out/nas
          cp servidor/nas/docker-compose.yml servidor/nas/cerebro.js servidor/nas/LEEME.md app/host.js out/nas/
          (cd out/nas && zip -qr ../LAP-Cerebro-NAS.zip .)
      - uses: actions/upload-artifact@v4
        with:
          name: LAP-Cerebro-Servidor-Windows
          path: |
            out/LAP-Cerebro-Servidor-Windows.zip
            out/LAP-Cerebro-Reglas.zip
            out/LAP-Cerebro-NAS.zip
          if-no-files-found: error

  release:
    name: Publicar versión
    # Con un tag v* o a mano desde Actions marcando "publicar". El número sale de app/package.json.
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publicar
    needs: [app, servidor]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - name: Crear el release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="v$(node -p "require('./app/package.json').version")"
          if [[ "${GITHUB_REF}" == refs/tags/v* && "${GITHUB_REF_NAME}" != "${VERSION}" ]]; then
            echo "El tag ${GITHUB_REF_NAME} no coincide con la versión ${VERSION} de app/package.json." >&2
            exit 1
          fi
          gh release create "${VERSION}" files/* \
            --target "${GITHUB_SHA}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "LAP Cerebro ${VERSION}" \
            --notes "Los PC que ya tienen LAP Cerebro 2.1 o posterior se actualizan solos. Para instalar por primera vez, usa LAP-Cerebro-Setup en cada PC. El servidor va en un solo PC o NAS: ver LEEME.md dentro del zip."
