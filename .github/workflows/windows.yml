name: App de Windows y servidor

on:
  push:
    branches: ["main", "claude/**"]
    tags: ["v*"]
    paths: ["app/**", "servidor/**", ".github/workflows/windows.yml"]
  workflow_dispatch:

permissions:
  contents: write

env:
  PB_VERSION: "0.40.5"

jobs:
  app:
    name: Instalador de Windows
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json
      # Sin scripts de instalación: electron-builder descarga Electron por su cuenta.
      - run: npm ci --ignore-scripts
      - run: npm run vendor
      - run: npx electron-builder --win nsis --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: LAP-Cerebro-Setup
          path: app/dist/*.exe
          if-no-files-found: error

  servidor:
    name: Servidor para Windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Armar el paquete del servidor
        run: |
          mkdir -p out/LAP-Cerebro-Servidor
          curl -fsSL -o pb.zip "https://github.com/pocketbase/pocketbase/releases/download/v${PB_VERSION}/pocketbase_${PB_VERSION}_windows_amd64.zip"
          unzip -q pb.zip pocketbase.exe -d out/LAP-Cerebro-Servidor
          cp -r servidor/pb_migrations servidor/pb_hooks servidor/*.bat servidor/LEEME.md out/LAP-Cerebro-Servidor/
          cd out && zip -qr LAP-Cerebro-Servidor-Windows.zip LAP-Cerebro-Servidor
      - uses: actions/upload-artifact@v4
        with:
          name: LAP-Cerebro-Servidor-Windows
          path: out/LAP-Cerebro-Servidor-Windows.zip
          if-no-files-found: error

  release:
    name: Publicar versión
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [app, servidor]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - name: Crear el release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" files/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "LAP Cerebro ${GITHUB_REF_NAME}" \
            --notes "Instala LAP-Cerebro-Setup en cada PC. El servidor va en un solo PC o NAS: ver LEEME.md dentro del zip."
